# Redis Configuration
# Bind to all interfaces
bind 0.0.0.0

# Port
port 6379

# Password authentication
requirepass rvSqetVQklW4AjSpxk4vX5vvc

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Logging
loglevel notice

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Security
protected-mode yes
